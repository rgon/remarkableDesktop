[package]
name = "remdesktop-host"
version = "0.11.4" # x-release-please-version
edition = "2024"

[dependencies]
libc = "0.2"
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }
remdesktop-proto = { path = "../proto" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
