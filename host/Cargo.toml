[package]
name = "remdesktop-host"
version = "0.11.8" # x-release-please-version
edition = "2024"

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
libc = "0.2"
pipewire = "0.9"
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }
remdesktop-proto = { path = "../proto" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
naga = { version = "25", default-features = false, features = ["wgsl-in", "spv-out"] }
