name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tablet binaries: glibc-linked against 2.31 with zig, like run.sh does.
  build-tablet:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: armv7
            target: armv7-unknown-linux-gnueabihf
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig and cargo-zigbuild
        run: |
          # cargo-zigbuild runs `python3 -m ziglang` when there is no `zig` binary
          python3 -m pip install --user --break-system-packages ziglang
          pipx install cargo-zigbuild

      - name: Build tablet binary
        run: |
          cargo zigbuild -p remdesktop-tablet --release --target ${{ matrix.target }}.2.31
          cp target/${{ matrix.target }}/release/remdesktop remdesktop-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: tablet-${{ matrix.arch }}
          path: remdesktop-${{ matrix.arch }}
          if-no-files-found: error

  # Built on 24.04 (libpipewire 1.0, glibc 2.39): that is the oldest glibc the
  # AppImage runs on, and the PipeWire the bindings are built against.
  build:
    needs: [build-tablet]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxkbcommon-dev libpipewire-0.3-dev libclang-dev pkg-config

      - name: Run tests
        run: cargo test --release -p remdesktop-proto -p remdesktop-host

      - uses: actions/download-artifact@v7
        with:
          pattern: tablet-*
          path: tablet-bin
          merge-multiple: true

      - name: Build AppImage
        env:
          TABLET_DIR: ${{ github.workspace }}/tablet-bin
          REQUIRE_TABLET: "1"
        run: bash scripts/build-appimage.sh

      - name: Stage AppImage for the release job
        uses: actions/cache/save@v5
        with:
          path: dist/*.AppImage
          key: remdesktop-appimage-${{ github.sha }}

  # release-please runs twice per master push, in two jobs, so the tag exists
  # (build-release un-drafts the release) before the next release PR is built.
  # With `draft: true` GitHub only creates the tag on publish, and release-please
  # finds the previous release by tag, so do not merge these halves together.
  release-please:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build-release:
    needs: [build, release-please]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore AppImage
        uses: actions/cache/restore@v5
        with:
          path: dist/*.AppImage
          key: remdesktop-appimage-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Upload AppImage and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          chmod +x dist/*.AppImage
          gh release upload "$tag" dist/*.AppImage
          gh release edit "$tag" --draft=false

      - name: Delete draft release on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ needs.release-please.outputs.tag_name }}" --yes || true

  release-pr:
    needs: [build, release-please, build-release]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.release-please.result == 'success' &&
      needs.build-release.result != 'failure' &&
      needs.build-release.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release_pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # release-please bumps the Cargo.toml versions but never runs cargo, so
      # Cargo.lock is stale on the branch it just pushed.
      - uses: actions/checkout@v5
        if: steps.release_pr.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release_pr.outputs.pr || '{}').headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release_pr.outputs.prs_created == 'true'

      - name: Refresh Cargo.lock on the release branch
        if: steps.release_pr.outputs.prs_created == 'true'
        run: |
          cargo update --workspace
          git diff --quiet Cargo.lock && exit 0
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore: update Cargo.lock for release'
          git push
