name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxkbcommon-dev pkg-config

      - name: Run tests
        run: cargo test --release -p remdesktop-proto -p remdesktop-host

      - name: Build AppImage
        run: bash scripts/build-appimage.sh

      - name: Stage AppImage for the release job
        uses: actions/cache/save@v4
        with:
          path: dist/*.AppImage
          key: remdesktop-appimage-${{ github.sha }}

  # release-please runs twice per master push, in two jobs, so the tag exists
  # (build-release un-drafts the release) before the next release PR is built.
  # With `draft: true` GitHub only creates the tag on publish, and release-please
  # finds the previous release by tag, so do not merge these halves together.
  release-please:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build-release:
    needs: [build, release-please]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore AppImage
        uses: actions/cache/restore@v4
        with:
          path: dist/*.AppImage
          key: remdesktop-appimage-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Upload AppImage and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          chmod +x dist/*.AppImage
          gh release upload "$tag" dist/*.AppImage
          gh release edit "$tag" --draft=false

      - name: Delete draft release on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ needs.release-please.outputs.tag_name }}" --yes || true

  release-pr:
    needs: [build, release-please, build-release]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.release-please.result == 'success' &&
      needs.build-release.result != 'failure' &&
      needs.build-release.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release_pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # release-please bumps the Cargo.toml versions but never runs cargo, so
      # Cargo.lock is stale on the branch it just pushed.
      - uses: actions/checkout@v4
        if: steps.release_pr.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release_pr.outputs.pr || '{}').headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release_pr.outputs.prs_created == 'true'

      - name: Refresh Cargo.lock on the release branch
        if: steps.release_pr.outputs.prs_created == 'true'
        run: |
          cargo update --workspace
          git diff --quiet Cargo.lock && exit 0
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore: update Cargo.lock for release'
          git push
